name: eduardOS Alpha live ISO

on:
  # Preview ISO builds are manual to avoid repeated multi-GB builds and
  # the GitHub-hosted runner disk exhaustion observed in earlier iterations.
  workflow_dispatch:
  # One pre-merge checkpoint build on this dedicated PR branch only;
  # GitHub does not activate new PR workflow triggers from base until merged.
  push:
    branches:
      - "ci/alpha02-iso-release-checkpoint"
  # One checkpoint build when the release-image packaging or boot contract
  # changes; NOT on ordinary application/theme/docs PRs.
  pull_request:
    paths:
      - "hosts/live-iso/**"
      - "installer/forge_vm_iso_launcher.py"
      - "flake.nix"
      - "scripts/smoke-live-iso.sh"
      - ".github/workflows/live-iso.yml"

concurrency:
  group: eduardos-live-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-iso:
    name: Build and boot-test eduardOS Alpha 0.2 VM-only candidate ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Recover disposable GitHub runner disk space
        run: |
          df -h /
          # These SDKs are unrelated to Nix or QEMU; the runner is disposable.
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /

      - name: Install diskless QEMU smoke-test tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Validate preview tooling and live ISO configuration
        run: |
          bash -n scripts/reassemble-live-iso.sh scripts/smoke-live-iso.sh
          nix build --no-link --print-build-logs .#checks.x86_64-linux.live-iso-config
          df -h /

      - name: Build live ISO (manual, not PR merge gate)
        run: |
          nix build --out-link result --print-build-logs --option max-jobs 2 .#live-iso
          df -h /

      - name: Verify real ISO boots to multi-user target in diskless QEMU
        run: |
          iso="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          EDOS_BOOT_TIMEOUT_SECONDS=300 bash scripts/smoke-live-iso.sh "$iso"

      - name: Split candidate ISO into artifact parts and compute checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          iso="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          sha256sum "$iso" | awk '{print $1 "  eduardos-alpha.iso"}' > artifacts/SHA256SUMS
          printf 'eduardOS Alpha 0.2 VM-only release candidate — Forged in Darkness\nCommit: %s\nWorkflow: %s\nInstaller: disposable QEMU /dev/vda only, explicit root console consent; NOT for physical disks\nVerification: diskless ISO boot smoke only; ISO-originated installation remains unverified\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/BUILDINFO.txt
          split -b 1900M --numeric-suffixes=0 --suffix-length=3 \
            "$iso" artifacts/eduardos-alpha.iso.part-
          ls -lh artifacts/
          # Prove uploaded parts reconstruct exactly the SHA256-identified
          # ISO rather than relying on a successful split command alone.
          actual="$(cat artifacts/eduardos-alpha.iso.part-* | sha256sum | cut -d' ' -f1)"
          expected="$(awk '{print $1}' artifacts/SHA256SUMS)"
          test "$actual" = "$expected"
          echo "PASS: uploaded candidate ISO parts match SHA256SUMS"

      - name: Upload verified preview ISO and build identity
        uses: actions/upload-artifact@v4
        with:
          name: eduardos-alpha-live-iso
          path: artifacts/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
