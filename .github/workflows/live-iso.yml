name: eduardOS Alpha live ISO

on:
  workflow_dispatch:

concurrency:
  group: eduardos-live-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-iso:
    name: Build bootable eduardOS Alpha ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Free runner disk space before the Nix build
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Disk space before cleanup"
          df -h / "$RUNNER_TEMP"
          echo "::endgroup::"

          # Hosted Ubuntu images contain SDKs unrelated to our x86_64 Nix ISO.
          # Remove only known runner preinstalls, before installing Nix.
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup

          echo "::group::Disk space after cleanup"
          df -h / "$RUNNER_TEMP"
          echo "::endgroup::"
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build live ISO (manual, not PR merge gate)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Disk capacity available for Nix and ISO output"
          df -h / /nix/store
          echo "::endgroup::"
          nix build --out-link result --print-build-logs .#live-iso
      - name: Report disk usage after ISO build
        if: always()
        run: |
          df -h / /nix/store
          du -sh /nix/store 2>/dev/null || true
      - name: Split ISO into manageable artifact parts and checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts
          iso="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          sha256sum "$iso" | sed "s|$iso|eduardos-alpha.iso|" > artifacts/SHA256SUMS
          split -b 1900M --numeric-suffixes=0 --suffix-length=3 \
            "$iso" artifacts/eduardos-alpha.iso.part-
          ls -lh artifacts/
      - name: Upload ISO parts and checksum
        uses: actions/upload-artifact@v4
        with:
          name: eduardos-alpha-live-iso
          path: artifacts/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
