name: eduardOS Alpha live ISO

on:
  # Preview ISO builds are manual to avoid repeated multi-GB builds and
  # the GitHub-hosted runner disk exhaustion observed in earlier iterations.
  workflow_dispatch:

concurrency:
  group: eduardos-live-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-iso:
    name: Build and boot-test eduardOS Alpha preview ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Recover disposable GitHub runner disk space
        run: |
          df -h /
          # These SDKs are unrelated to Nix or QEMU; the runner is disposable.
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /

      - name: Install diskless QEMU smoke-test tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Validate preview tooling and live ISO configuration
        run: |
          bash -n scripts/reassemble-live-iso.sh scripts/smoke-live-iso.sh
          nix build --no-link --print-build-logs .#checks.x86_64-linux.live-iso-config
          df -h /

      - name: Build live ISO (manual, not PR merge gate)
        run: |
          nix build --out-link result --print-build-logs --option max-jobs 2 .#live-iso
          df -h /

      - name: Verify real ISO boots to multi-user target in diskless QEMU
        run: |
          iso="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          EDOS_BOOT_TIMEOUT_SECONDS=300 bash scripts/smoke-live-iso.sh "$iso"

      - name: Split ISO into artifact parts and compute checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          iso="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          sha256sum "$iso" | awk '{print $1 "  eduardos-alpha.iso"}' > artifacts/SHA256SUMS
          printf 'eduardOS Alpha 0.1 preview — Forged in Neon\nCommit: %s\nWorkflow: %s\nLive ISO: not physically installable\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/BUILDINFO.txt
          split -b 1900M --numeric-suffixes=0 --suffix-length=3 \
            "$iso" artifacts/eduardos-alpha.iso.part-
          ls -lh artifacts/

      - name: Upload verified preview ISO and build identity
        uses: actions/upload-artifact@v4
        with:
          name: eduardos-alpha-live-iso
          path: artifacts/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
