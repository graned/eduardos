name: eduardOS system integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR commits; full disk installation runs separately.
concurrency:
  group: eduardos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Fast evaluation and theme checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Docker remote-builder configuration
        run: |
          bash -n builder/build.sh
          NIXBUILD_SSH_KEY=/tmp/placeholder docker compose -f builder/compose.yml config --quiet
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-system-features = kvm
      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Require committed, unchanged flake lock
        run: |
          nix flake metadata --no-write-lock-file --json >/dev/null
          git diff --exit-code -- flake.lock
      - name: Evaluate flake
        run: nix flake check --no-build --show-trace
      - name: Validate live ISO profile (without building ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.live-iso-config
      - name: Validate mounted-target auditor safety fixtures (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-mount-audit-tests
      - name: Validate guarded backend disk and encrypted-mount attestation (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-backend-tests
      - name: Validate one-shot root local preflight session and socket lifecycle (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-local-service-tests
      - name: Validate kernel-authenticated local credential transport (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-local-ipc-tests
      - name: Validate sealed LUKS/account descriptor handoff (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-secret-handoff-tests
      - name: Validate credential staging and sealed LUKS FD (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-credentials-tests
      - name: Evaluate installed target profile without a disk or ISO
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.installed-profile-config
      - name: Validate real-user disposable VM profile (no ISO or closure build)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.installed-user-lab-config
      - name: Validate live ISO backing-media provenance (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-live-media-tests
      - name: Validate root-only system disk ancestry guards (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-privileged-preflight-tests
      - name: Validate root-only one-shot preflight request protocol (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-privileged-protocol-tests
      - name: Validate one-shot authorization and credential guards (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-authorization-tests
      - name: Validate disk identity and stale-review protection (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-disk-review-tests
      - name: Validate one-shot installation transaction and fault handling (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-install-transaction-tests
      - name: Validate guarded VM-only installation executor (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-installer-lab-tests
      - name: Validate Forge Neon GUI security and preview API (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-installer-gui-tests
      - name: Validate Forge Installer read-only preflight (no ISO)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.forge-installer-tests
      - name: Validate UEFI storage layout
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.uefi-storage-layout
      - name: Validate all three Forge themes
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.theme-presets

  storage-smoke:
    name: Encrypted data persistence and boot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-system-features = kvm
      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build UEFI installation closure
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.uefi-install-config
      - name: Verify encrypted data survives a QEMU cold boot
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.storage-persistence
      - name: Boot existing NixOS system in QEMU
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.boot
      - name: Build interactive VM launcher
        run: nix build --no-link --print-build-logs .#vm

  desktop:
    name: Hyprland keyboard and three theme previews
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-system-features = kvm
      - name: Restore and save Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Test keyboard input and capture actual desktop screenshots
        run: |
          nix build --out-link graphical-test-result --print-build-logs .#checks.x86_64-linux.hyprland-session
          mkdir -p artifacts/screenshots
          cp -L graphical-test-result/*.png artifacts/screenshots/
          test -f artifacts/screenshots/obsidian-forge-ghostty-before.png
          test -f artifacts/screenshots/obsidian-forge-ghostty-after-shortcut.png
      - name: Upload desktop screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-forge-desktop-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Render all three Forge themes in QEMU
        run: |
          mkdir -p artifacts/theme-previews
          for preset in classic neon brutalist; do
            nix build --out-link "theme-preview-$preset-result" --print-build-logs ".#checks.x86_64-linux.theme-preview-$preset"
            for shot in desktop launcher wallpaper; do
              cp -L "theme-preview-$preset-result/forge-$preset-$shot.png" artifacts/theme-previews/
            done
          done
          test "$(find artifacts/theme-previews -maxdepth 1 -name '*.png' | wc -l)" -eq 9
      - name: Upload Forge theme previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eduardos-theme-previews
          path: artifacts/theme-previews/
          if-no-files-found: warn
          retention-days: 14
