# eduardOS · Forge Brutalist — basalt geometry and restrained amber.
# Keep the same keyboard/mouse behavior as Classic and Neon.
monitor = ,preferred,auto,1

$terminal = ghostty
$launcher = fuzzel

$mod = SUPER
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen,
bind = $mod, SPACE, togglefloating,
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}

general {
  gaps_in = 8
  gaps_out = 18
  border_size = 2
  col.active_border = rgba(e6a04eff)
  col.inactive_border = rgba(454348ff)
  layout = dwindle
}

decoration {
  rounding = 3
  active_opacity = 1.0
  inactive_opacity = 1.0
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = true
  bezier = forge, 0.16, 1, 0.3, 1
  animation = windows, 1, 2, forge
  animation = fade, 1, 2, default
  animation = workspaces, 1, 2, forge
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}

exec-once = swaybg -i /etc/xdg/eduardos/forge-brutalist-wallpaper.jpg -m fill
exec-once = waybar
exec-once = mako

# Screensharing and portals are supplied by the NixOS Hyprland module.
