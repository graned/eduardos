# eduardOS · Forge Classic — premium lightweight industrial desktop.
# Personal overrides will be provided through Home Manager later.
monitor = ,preferred,auto,1

$terminal = ghostty
$launcher = fuzzel

$mod = SUPER
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $launcher
# Screenshot without writing files: full display / selected region to clipboard.
bind = , PRINT, exec, edos-screenshot screen
bind = $mod SHIFT, S, exec, edos-screenshot region
# Open a terminal with the read-only Rust diagnostics for this system.
bind = $mod SHIFT, D, exec, ghostty -e edos doctor
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen,
bind = $mod, SPACE, togglefloating,
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}

general {
  gaps_in = 7
  gaps_out = 18
  border_size = 2
  col.active_border = rgba(e56b35ff)
  col.inactive_border = rgba(414046ff)
  layout = dwindle
}

decoration {
  rounding = 10
  active_opacity = 1.0
  inactive_opacity = 0.97
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = true
  bezier = forge, 0.16, 1, 0.3, 1
  animation = windows, 1, 3, forge
  animation = fade, 1, 3, default
  animation = workspaces, 1, 3, forge
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}

exec-once = swaybg -i /etc/xdg/eduardos/forge-classic-wallpaper.jpg -m fill
exec-once = waybar
exec-once = mako

# Screensharing and portals are configured by the NixOS Hyprland module.
